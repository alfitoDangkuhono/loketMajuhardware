# =============================================================================
# docker-compose.yaml - loket-majuhardware
#
# CARA PAKAI (untuk orang yang sudah clone repo ini):
#   1. Pastikan Docker / Docker Desktop sudah berjalan.
#   2. (Opsional) buat file .env di root untuk override variabel di bawah.
#   3. Jalankan:  docker compose up -d
#   4. Buka http://localhost:8080
#
# Image yang dipakai di-pull otomatis dari Docker Hub sesuai variabel IMAGE.
# Jika image belum ada di Docker Hub dan ingin membangun dari source:
#   docker compose up -d --build
#
# Variabel bisa di-override lewat file .env (compose membaca .env otomatis):
#   IMAGE=alfitodangkuhono/loket-majuhardware:latest
#   DB_DATABASE=antrian_mh
#   DB_USERNAME=postgres
#   DB_PASSWORD=postgres
# =============================================================================

services:
  app:
    image: ${IMAGE:-alfitodangkuhono/loket-majuhardware:latest}
    container_name: loket-majuhardware-app
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      # === Aplikasi Laravel ===
      APP_NAME: "Loket Maju Hardware"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8080"

      # === Database (disambungkan ke service `db`) ===
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-antrian_mh}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}

      # === Cache / Session / Queue ===
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync

      # === Thermal printer (fitur Windows, di container dinonaktifkan) ===
      THERMAL_PRINTER_MODE: file
      THERMAL_PRINTER_NAME: ""
      THERMAL_PRINTER_WIDTH: "32"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Persist data upload (video, audio, dll) supaya tidak hilang saat container dihapus
      - app-storage:/var/www/html/storage/app
      # Simpan log antar restart
      - app-logs:/var/www/html/storage/logs
    networks:
      - loket-net

  db:
    image: postgres:16-alpine
    container_name: loket-majuhardware-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-antrian_mh}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      # Autentikasi md5 agar aplikasi (pdo_pgsql) bisa login dengan password.
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    volumes:
      # Persist database antar restart/rebuild container
      - db-data:/var/lib/postgresql/data
    ports:
      # Opsional: ekspos DB ke host bila ingin akses via tool seperti DBeaver/pgAdmin
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-antrian_mh}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - loket-net

networks:
  loket-net:
    driver: bridge

volumes:
  db-data:
    name: loket-majuhardware-db
  app-storage:
    name: loket-majuhardware-storage
  app-logs:
    name: loket-majuhardware-logs
